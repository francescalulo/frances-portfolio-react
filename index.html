<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <!-- Preloader only: the logo's font, just the letters it uses (a few kB) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@1,800&text=%7B%7DfrancesCalulo&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Frances Calulo" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#06000f" />

    <!-- Light mode (ThemeToggle): apply the saved choice before the page draws, so a
         light-mode visitor never sees a flash of the dark theme -->
    <script>
      try {
        if (localStorage.getItem("fc-theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch {
        // Storage blocked: stay on the default dark theme
      }
    </script>

    <!-- Site-wide defaults. Each page sets its own title, description and canonical link
         (PageMeta). Share previews use these, because social sites don't run JavaScript. -->
    <meta name="author" content="Frances Calulo" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Frances Calulo" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:url" content="https://francescalulo.com/" />
    <meta property="og:title" content="Frances Calulo | Designer & Developer" />
    <meta
      property="og:description"
      content="Designer and developer Frances Calulo builds accessible, mobile-first websites with React and headless WordPress, turning coffee into pixels and pixels into code."
    />
    <meta
      property="og:image"
      content="https://francescalulo.com/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The {f} logo with Frances Calulo, Designer & Developer"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <title>Frances Calulo | Designer & Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
